<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F8F9FA" />
            <stop offset="50%" stop-color="#ECEFF3" />
            <stop offset="100%" stop-color="#D9E2EC" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.6"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="1920" height="600" fill="url(#bgGrad)" />
    <rect width="1920" height="600" fill="url(#grid)" />

    <!-- Safe Content Zone (Left) -->
    <rect x="60" y="40" width="1020" height="520" rx="16" fill="#85172C" fill-opacity="0.04" stroke="#85172C" stroke-width="2" stroke-dasharray="8 6"/>
    
    <!-- Visual Focal Zone (Right) -->
    <rect x="1120" y="40" width="740" height="520" rx="16" fill="#2563EB" fill-opacity="0.04" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Left Label: Safe Content Area -->
    <g transform="translate(100, 100)">
        <rect width="280" height="36" rx="18" fill="#85172C"/>
        <text x="140" y="23" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SAFE ZONE: KONTEN &amp; SEARCH</text>
        
        <text x="0" y="80" fill="#171A1F" font-family="'Lora', Georgia, serif" font-size="34" font-weight="700">Area Teks &amp; Kolom Pencarian</text>
        <text x="0" y="115" fill="#475569" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16">Lebar: ~1000px | Ruang untuk Judul FAQ, Breadcrumb, dan Search Bar</text>
        
        <!-- Mock Search Bar -->
        <g transform="translate(0, 150)">
            <rect width="640" height="60" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
            <circle cx="35" cy="30" r="10" fill="none" stroke="#94A3B8" stroke-width="2"/>
            <line x1="42" y1="37" x2="50" y2="45" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
            <text x="65" y="36" fill="#94A3B8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15">Cari pertanyaan, misalnya "cara mengisi KRS"</text>
            <rect x="490" y="8" width="140" height="44" rx="22" fill="#85172C"/>
            <text x="560" y="35" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Cari jawaban &#8594;</text>
        </g>
        
        <text x="0" y="260" fill="#64748B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14">&#8226; Pastikan kontras teks terjaga dengan gradient overlay (putih/terang di sisi kiri)</text>
    </g>

    <!-- Right Label: Focal Photo Area -->
    <g transform="translate(1160, 100)">
        <rect width="280" height="36" rx="18" fill="#2563EB"/>
        <text x="140" y="23" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FOCAL ZONE: FOTO UTAMA</text>
        
        <text x="0" y="80" fill="#171A1F" font-family="'Lora', Georgia, serif" font-size="30" font-weight="700">Area Visual Gedung Kampus</text>
        <text x="0" y="115" fill="#475569" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15">Fokus gedung universitas, kubah, pohon, dan lansekap</text>
        
        <!-- Floating Card Mockup -->
        <g transform="translate(0, 150)">
            <rect width="360" height="140" rx="18" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1.5"/>
            <text x="30" y="40" fill="#85172C" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700">&#9962; DISESUAIKAN UNTUKMU</text>
            <text x="30" y="75" fill="#171A1F" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="700">Fakultas Teknik</text>
            <text x="30" y="100" fill="#64748B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14">Program Studi Informatika</text>
            <text x="30" y="125" fill="#85172C" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600">Ubah fakultas &#9662;</text>
        </g>
    </g>

    <!-- Header & Dimensions Bar -->
    <rect x="0" y="0" width="1920" height="40" fill="#171A1F"/>
    <text x="40" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600">TEMPLATE BACKGROUND HERO BANNER FAQ MAHASISWA</text>
    <text x="960" y="25" fill="#94A3B8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" text-anchor="middle">UKURAN STANDAR: 1920 &#215; 600 px (Rasio 16:5) | HIGH-RES: 2560 &#215; 800 px</text>
    <text x="1880" y="25" fill="#38BDF8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">KMS Knowledge System</text>

    <!-- Footer Guide Bar -->
    <rect x="0" y="565" width="1920" height="35" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="960" y="588" fill="#64748B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
        Format yang didukung: JPG, WebP, atau PNG | Simpan file pengganti di: <tspan fill="#85172C" font-weight="700">public/images/mahasiswa/banner-faq.jpg</tspan>
    </text>
</svg>
